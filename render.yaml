services:
  - type: web
    name: hotel-sathi-pms
    env: python
    buildCommand: "npm install && npm run build && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: DATABASE_URL
        sync: false # Set this in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false # Set this in the Render dashboard
